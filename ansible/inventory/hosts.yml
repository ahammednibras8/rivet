all:
  children:
    rivet_workspace:
      hosts:
        rivet-workspace:
          ansible_host: "{{ lookup('ansible.builtin.env', 'RIVET_WORKSPACE_IP', default=undef()) }}"
          ansible_user: rivet-admin
          rivet_operator_ssh_public_key: "{{ lookup('ansible.builtin.env', 'RIVET_OPERATOR_SSH_PUBLIC_KEY', default=undef()) }}"
