---
- name: Maintain deployment control directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: /opt/rivet/deployment
      owner: root
      group: root
      mode: "0755"
    - path: /opt/rivet/deployment/collections
      owner: root
      group: root
      mode: "0755"
    - path: /opt/rivet/aws-cli
      owner: root
      group: root
      mode: "0755"
    - path: /var/cache/rivet/deployment
      owner: root
      group: root
      mode: "0755"
    - path: "/var/cache/rivet/deployment/aws-cli-{{ deployment_control_aws_cli_version }}"
      owner: root
      group: root
      mode: "0755"
    - path: /var/lib/rivet/deployment
      owner: root
      group: rivet
      mode: "0750"
    - path: /var/lib/rivet/deployment/releases
      owner: root
      group: rivet
      mode: "0750"
    - path: /var/log/rivet
      owner: root
      group: rivet
      mode: "0750"
    - path: /home/rivet/.aws
      owner: rivet
      group: rivet
      mode: "0700"
    - path: /home/rivet/.local/state/rivet/infrastructure
      owner: rivet
      group: rivet
      mode: "0700"
