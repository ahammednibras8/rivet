---
- name: Keep the T3 Code service user active after logout
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - rivet
    creates: /var/lib/systemd/linger/rivet

- name: Read the T3 Code service account
  ansible.builtin.getent:
    database: passwd
    key: rivet

- name: Wait for the T3 Code user manager
  ansible.builtin.wait_for:
    path: "/run/user/{{ getent_passwd.rivet[1] }}/bus"
    state: present
    timeout: 30
  when: not ansible_check_mode

- name: Install the T3 Code user service
  ansible.builtin.command:
    argv:
      - /home/rivet/.local/bin/t3
      - service
      - install
  become: true
  become_user: rivet
  environment:
    HOME: /home/rivet
    PATH: /home/rivet/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.rivet[1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ getent_passwd.rivet[1] }}/bus"
  register: t3_code_service_install
  changed_when: >-
    "Installed T3 Code service" in t3_code_service_install.stdout or
    "Updated T3 Code service" in t3_code_service_install.stdout
  when: not ansible_check_mode

- name: Maintain T3 Code service override directory
  ansible.builtin.file:
    path: /home/rivet/.config/systemd/user/t3code.service.d
    state: directory
    owner: rivet
    group: rivet
    mode: "0700"

- name: Pin T3 Code service to loopback
  ansible.builtin.copy:
    content: |
      [Service]
      Environment=T3CODE_HOST=127.0.0.1
    dest: /home/rivet/.config/systemd/user/t3code.service.d/10-loopback.conf
    owner: rivet
    group: rivet
    mode: "0600"
  register: t3_code_loopback_override

- name: Apply T3 Code loopback service override
  ansible.builtin.systemd_service:
    name: t3code.service
    scope: user
    daemon_reload: true
    state: restarted
  become: true
  become_user: rivet
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.rivet[1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ getent_passwd.rivet[1] }}/bus"
  when:
    - not ansible_check_mode
    - t3_code_loopback_override.changed

- name: Read T3 Code service enabled state
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-enabled
      - t3code.service
  become: true
  become_user: rivet
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.rivet[1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ getent_passwd.rivet[1] }}/bus"
  register: t3_code_service_enabled
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Read T3 Code service active state
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - t3code.service
  become: true
  become_user: rivet
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.rivet[1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ getent_passwd.rivet[1] }}/bus"
  register: t3_code_service_active
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Verify T3 Code service supervision
  ansible.builtin.assert:
    that:
      - t3_code_service_enabled.rc == 0
      - t3_code_service_enabled.stdout == "enabled"
      - t3_code_service_active.rc == 0
      - t3_code_service_active.stdout == "active"
    fail_msg: T3 Code must be enabled and active under the rivet systemd user manager
  when: not ansible_check_mode
