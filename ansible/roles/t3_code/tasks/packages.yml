---
- name: Install T3 Code runtime packages
  ansible.builtin.apt:
    name:
      - libasound2t64
      - libatomic1
      - libatk-bridge2.0-0t64
      - libatk1.0-0t64
      - libatspi2.0-0t64
      - libgbm1
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
    state: present
    update_cache: true
    cache_valid_time: 3600
