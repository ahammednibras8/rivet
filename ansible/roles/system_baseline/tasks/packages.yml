---
- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - acl
      - ansible-core
      - build-essential
      - ca-certificates
      - curl
      - docker-compose-v2
      - docker.io
      - git
      - jq
      - make
      - python3-dev
      - sqlite3
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
