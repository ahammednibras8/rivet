---
- name: Validate the operator IPv4 CIDR
  ansible.builtin.assert:
    that:
      - >-
        rivet_operator_ipv4_cidr is match(
          '^(?:(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}'
          ~ '(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])/32$'
        )
    fail_msg: RIVET_OPERATOR_IPV4_CIDR must be one IPv4 address with a /32 prefix.
