---
- name: Verify an unsupported platform fails
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_facts:
      distribution: Debian
      distribution_release: bookworm
      distribution_version: "12"
      architecture: x86_64

  tasks:
    - name: Run the platform guard
      ansible.builtin.include_role:
        name: system_baseline
        tasks_from: platform.yml
